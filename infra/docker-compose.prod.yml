# Production : l'appli accessible depuis l'atelier, la maison ou un téléphone, en HTTPS.
#
# Lancer depuis le dossier infra :  docker compose --env-file ../.env -f docker-compose.prod.yml up -d --build
#
# Prérequis : un nom de domaine (APP_DOMAIN, ex : atelier.pcpro-services.be) qui pointe vers la machine,
# et les ports 80 et 443 ouverts vers elle. Caddy obtient et renouvelle le certificat HTTPS tout seul.
#
# Seul Caddy est exposé sur Internet. Le backend et PostgreSQL restent sur le réseau Docker interne.
services:
  caddy:
    # Caddy avec le front (application Angular) construit dedans
    build:
      context: ../front
    container_name: atelier-caddy
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN doit être défini dans .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  backend:
    build:
      context: ../backend
    container_name: atelier-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD doit être défini dans .env}
      APP_JWT_SECRET: ${APP_JWT_SECRET:?APP_JWT_SECRET doit être défini dans .env}
      # Front et API sur le même domaine : pas besoin de CORS
      APP_CORS_ALLOWED_ORIGINS: ""
      APP_COOKIE_SECURE: "true"
      APP_SWAGGER_ENABLED: "false"
      APP_BOOTSTRAP_ADMIN_LOGIN: ${APP_BOOTSTRAP_ADMIN_LOGIN:-}
      APP_BOOTSTRAP_ADMIN_PASSWORD: ${APP_BOOTSTRAP_ADMIN_PASSWORD:-}
      APP_URL_PUBLIQUE: https://${APP_DOMAIN}
      # Identité imprimée sur les documents (voir application.yml pour le détail de chaque variable)
      APP_ATELIER_NOM: ${APP_ATELIER_NOM:-PC PRO}
      APP_ATELIER_SLOGAN: ${APP_ATELIER_SLOGAN:-Réparation informatique}
      APP_ATELIER_RAISON_SOCIALE: ${APP_ATELIER_RAISON_SOCIALE:-Brahim Mehdi}
      APP_ATELIER_BCE: ${APP_ATELIER_BCE:-0895968808}
      APP_ATELIER_TVA_REGIME: ${APP_ATELIER_TVA_REGIME:-FRANCHISE}
      APP_ATELIER_TVA_TAUX: ${APP_ATELIER_TVA_TAUX:-21}
      APP_ATELIER_IBAN: ${APP_ATELIER_IBAN:-}
      APP_ATELIER_BIC: ${APP_ATELIER_BIC:-}
      APP_ATELIER_ADRESSE: ${APP_ATELIER_ADRESSE:-Rue Wayez 24, 1070 Anderlecht}
      APP_ATELIER_TELEPHONE: ${APP_ATELIER_TELEPHONE:-+32 485 64 44 61}
      APP_ATELIER_EMAIL: ${APP_ATELIER_EMAIL:-pcpro@gmail.com}
      APP_ATELIER_SITE_WEB: ${APP_ATELIER_SITE_WEB:-pcpro-services.be}
      APP_ATELIER_HORAIRES: "${APP_ATELIER_HORAIRES:-Mar-jeu 10h-13h et 14h-18h30 · Ven 10h-13h30 et 15h-18h · Sam 10h-16h}"
      APP_GARANTIE_MOIS: ${APP_GARANTIE_MOIS:-3}
      APP_DEVIS_VALIDITE_JOURS: ${APP_DEVIS_VALIDITE_JOURS:-30}
      APP_CONDITIONS_DEPOT: ${APP_CONDITIONS_DEPOT:-}
      APP_MENTION_FACTURE: ${APP_MENTION_FACTURE:-}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      APP_MAIL_EXPEDITEUR: ${APP_MAIL_EXPEDITEUR:-}
    volumes:
      - photos_data:/app/uploads

  postgres:
    image: postgres:16
    container_name: atelier-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Sauvegarde de la base chaque nuit dans infra/backups (14 jours gardés).
  # Penser à copier ce dossier ailleurs (disque externe, cloud) de temps en temps.
  backup:
    image: postgres:16
    container_name: atelier-backup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          fichier=/backups/atelier-$$(date +%F).dump
          pg_dump --format=custom --file="$$fichier.tmp" && mv "$$fichier.tmp" "$$fichier" && echo "Sauvegarde OK : $$fichier"
          find /backups -name 'atelier-*.dump' -mtime +14 -delete
          sleep 86400
        done

volumes:
  postgres_data:
  photos_data:
  caddy_data:
  caddy_config:
