# Production : l'appli accessible depuis l'atelier, la maison ou un téléphone, en HTTPS.
#
# Avec Cloudflare Tunnel (recommandé : aucun port à ouvrir sur la box), voir docker-compose.tunnel.yml :
#   docker compose --env-file ../.env -f docker-compose.prod.yml -f docker-compose.tunnel.yml up -d --build
#
# Sans tunnel (ports 80 et 443 de la box redirigés vers la machine, APP_DOMAIN pointe vers elle) :
#   docker compose --env-file ../.env -f docker-compose.prod.yml up -d --build
# Caddy obtient et renouvelle alors le certificat HTTPS tout seul.
#
# Seul Caddy est exposé. Le backend et PostgreSQL restent sur le réseau Docker interne.
# Check-list de mise en ligne : docs/SECURITE.md

# Journaux limités en taille : sinon ils finissent par remplir le disque du serveur
x-journaux: &journaux
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  caddy:
    <<: *journaux
    # Caddy avec le front (application Angular) construit dedans
    build:
      context: ../front
    container_name: atelier-caddy
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      CADDY_SITE: ${APP_DOMAIN:?APP_DOMAIN doit être défini dans .env}
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  backend:
    <<: *journaux
    build:
      context: ../backend
    container_name: atelier-backend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD doit être défini dans .env}
      APP_JWT_SECRET: ${APP_JWT_SECRET:?APP_JWT_SECRET doit être défini dans .env}
      # Front et API sur le même domaine : pas besoin de CORS
      APP_CORS_ALLOWED_ORIGINS: ""
      APP_COOKIE_SECURE: "true"
      APP_SWAGGER_ENABLED: "false"
      APP_BOOTSTRAP_ADMIN_LOGIN: ${APP_BOOTSTRAP_ADMIN_LOGIN:-}
      APP_BOOTSTRAP_ADMIN_PASSWORD: ${APP_BOOTSTRAP_ADMIN_PASSWORD:-}
      APP_URL_PUBLIQUE: https://${APP_DOMAIN}
      APP_ATELIER_NOM: ${APP_ATELIER_NOM:-Pc Pro}
      APP_ATELIER_ADRESSE: ${APP_ATELIER_ADRESSE:-}
      APP_ATELIER_TELEPHONE: ${APP_ATELIER_TELEPHONE:-}
      APP_ATELIER_EMAIL: ${APP_ATELIER_EMAIL:-}
      APP_ATELIER_HORAIRES: ${APP_ATELIER_HORAIRES:-}
      APP_GARANTIE_MOIS: ${APP_GARANTIE_MOIS:-3}
      APP_CONDITIONS_DEPOT: ${APP_CONDITIONS_DEPOT:-}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      APP_MAIL_EXPEDITEUR: ${APP_MAIL_EXPEDITEUR:-}
    volumes:
      - photos_data:/app/uploads

  postgres:
    <<: *journaux
    image: postgres:16
    container_name: atelier-postgres
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Sauvegarde chaque nuit dans infra/backups : la base (14 jours gardés) et une copie des photos.
  # Les fichiers contiennent les données des clients : lisibles seulement par root sur le serveur.
  # Ce dossier doit aussi être copié hors de l'atelier (vol, incendie, disque mort) : voir docs/SECURITE.md.
  backup:
    <<: *journaux
    image: postgres:16
    container_name: atelier-backup
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backups:/backups
      - photos_data:/photos:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        umask 077
        chmod 700 /backups
        while true; do
          fichier=/backups/atelier-$$(date +%F).dump
          pg_dump --format=custom --file="$$fichier.tmp" && mv "$$fichier.tmp" "$$fichier" && echo "Sauvegarde OK : $$fichier"
          find /backups -name 'atelier-*.dump' -mtime +14 -delete
          # Photos : copie des nouvelles seulement (une photo supprimée dans l'appli reste dans la copie)
          mkdir -p /backups/photos && cp -R -u /photos/. /backups/photos/ && echo "Photos copiées"
          sleep 86400
        done

volumes:
  postgres_data:
  photos_data:
  caddy_data:
  caddy_config:
