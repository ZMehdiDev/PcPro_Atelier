# Production : l'appli accessible depuis l'atelier, la maison ou un téléphone, en HTTPS.
#
# Lancer depuis le dossier infra :  docker compose --env-file ../.env -f docker-compose.prod.yml up -d --build
#
# Prérequis : un nom de domaine (APP_DOMAIN, ex : atelier.pcpro-services.be) qui pointe vers la machine,
# et les ports 80 et 443 ouverts vers elle. Caddy obtient et renouvelle le certificat HTTPS tout seul.
#
# Seul Caddy est exposé sur Internet. Le backend et PostgreSQL restent sur le réseau Docker interne.
services:
  caddy:
    image: caddy:2-alpine
    container_name: atelier-caddy
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN doit être défini dans .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Le front (build Angular) sera servi depuis ce dossier
      - ./front:/srv/front:ro
      - caddy_data:/data
      - caddy_config:/config

  backend:
    build:
      context: ../backend
    container_name: atelier-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD doit être défini dans .env}
      APP_JWT_SECRET: ${APP_JWT_SECRET:?APP_JWT_SECRET doit être défini dans .env}
      # Front et API sur le même domaine : pas besoin de CORS
      APP_CORS_ALLOWED_ORIGINS: ""
      APP_COOKIE_SECURE: "true"
      APP_SWAGGER_ENABLED: "false"
      APP_BOOTSTRAP_ADMIN_LOGIN: ${APP_BOOTSTRAP_ADMIN_LOGIN:-}
      APP_BOOTSTRAP_ADMIN_PASSWORD: ${APP_BOOTSTRAP_ADMIN_PASSWORD:-}
    volumes:
      - photos_data:/app/uploads

  postgres:
    image: postgres:16
    container_name: atelier-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Sauvegarde de la base chaque nuit dans infra/backups (14 jours gardés).
  # Penser à copier ce dossier ailleurs (disque externe, cloud) de temps en temps.
  backup:
    image: postgres:16
    container_name: atelier-backup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          fichier=/backups/atelier-$$(date +%F).dump
          pg_dump --format=custom --file="$$fichier.tmp" && mv "$$fichier.tmp" "$$fichier" && echo "Sauvegarde OK : $$fichier"
          find /backups -name 'atelier-*.dump' -mtime +14 -delete
          sleep 86400
        done

volumes:
  postgres_data:
  photos_data:
  caddy_data:
  caddy_config:
