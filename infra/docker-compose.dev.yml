# Lancer depuis le dossier infra :  docker compose --env-file ../.env -f docker-compose.dev.yml up -d
#
# - "postgres" seul suffit pour développer le backend depuis l'IDE (profil dev, port 5432)
# - "backend" lance l'application packagée (profil par défaut = configuration de prod)
services:
  postgres:
    image: postgres:16
    container_name: atelier-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
    container_name: atelier-backend
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${SPRING_PORT}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      APP_JWT_SECRET: ${APP_JWT_SECRET:?APP_JWT_SECRET doit être défini dans .env}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-}
      # En local tout est en http : le cookie de session ne doit pas exiger HTTPS
      APP_COOKIE_SECURE: "false"
      APP_SWAGGER_ENABLED: ${APP_SWAGGER_ENABLED:-false}
      APP_BOOTSTRAP_ADMIN_LOGIN: ${APP_BOOTSTRAP_ADMIN_LOGIN:-}
      APP_BOOTSTRAP_ADMIN_PASSWORD: ${APP_BOOTSTRAP_ADMIN_PASSWORD:-}
    volumes:
      - photos_data:/app/uploads
    restart: unless-stopped

volumes:
  postgres_data:
  photos_data:
