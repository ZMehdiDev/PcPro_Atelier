# Profil de développement local : PostgreSQL de infra/docker-compose.dev.yml, données de démo,
# Swagger activé et front Angular (ng serve) autorisé.
spring:
  flyway:
    locations: classpath:db/migration,classpath:db/seed

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

app:
  security:
    jwt-secret: ${APP_JWT_SECRET:dev-only-secret-ne-pas-utiliser-en-production-0123456789}
    cors-allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200}
