server:
  port: 8080

spring:
  application:
    name: atelier-backend

---
spring:
  config:
    activate:
      on-profile: default
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/migration/dev
    baseline-on-migrate: true

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      jakarta.persistence.schema-generation.database.action: none
    open-in-view: false
    show-sql: false

logging:
  level:
    root: INFO
    org.springframework.web: INFO
    org.flywaydb: INFO

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui
    enabled: true