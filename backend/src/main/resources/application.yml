server:
  port: 8080

spring:
  application:
    name: atelier-backend
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

logging:
  level:
    root: INFO
    org.springframework.web: INFO
    org.flywaydb: INFO

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui
    enabled: true

app:
  storage:
    photos-directory: ./uploads/photos
    max-file-size-bytes: 10485760  # 10MB

