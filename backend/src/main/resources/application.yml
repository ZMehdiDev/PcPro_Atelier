server:
  port: 8080
  # Derrière le reverse proxy (Caddy) : vraie IP du client et HTTPS lus dans X-Forwarded-*.
  # Seuls les proxys d'un réseau privé (Docker) sont crus.
  forward-headers-strategy: native

spring:
  application:
    name: atelier-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/atelier}
    username: ${SPRING_DATASOURCE_USERNAME:atelier}
    password: ${SPRING_DATASOURCE_PASSWORD:atelier}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
    # Une base de dev (seed R__ appliqué) reste utilisable sans le profil dev
    ignore-migration-patterns: "repeatable:missing"
  # Emails aux clients. Le serveur se règle par variables d'environnement : SPRING_MAIL_HOST
  # (ex : smtp-relay.brevo.com), SPRING_MAIL_USERNAME, SPRING_MAIL_PASSWORD. Sans hôte, aucun email n'est envoyé.
  mail:
    port: 587
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

logging:
  level:
    root: INFO
    # PDFBox parcourt les polices du système au premier PDF et se plaint de celles qu'il ne sait pas lire :
    # les documents n'utilisent que la police Inter embarquée
    org.apache.pdfbox.pdmodel.font: ERROR

# Swagger désactivé par défaut (activé en dev ou via APP_SWAGGER_ENABLED=true)
springdoc:
  api-docs:
    enabled: ${APP_SWAGGER_ENABLED:false}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${APP_SWAGGER_ENABLED:false}
    path: /swagger-ui

app:
  timezone: Europe/Brussels
  # Informations imprimées sur les documents (bon de dépôt, devis, factures) et dans les emails, et règles de l'atelier
  atelier:
    nom: ${APP_ATELIER_NOM:PC PRO}
    slogan: ${APP_ATELIER_SLOGAN:Réparation informatique}
    # Nom légal (le titulaire de l'entreprise) et numéro BCE, obligatoires sur les factures
    raison-sociale: ${APP_ATELIER_RAISON_SOCIALE:Brahim Mehdi}
    bce: ${APP_ATELIER_BCE:0895968808}
    tva:
      # FRANCHISE (petite entreprise, pas de TVA sur les factures) ou ASSUJETTI (prix TVAC, TVA détaillée)
      regime: ${APP_ATELIER_TVA_REGIME:FRANCHISE}
      taux: ${APP_ATELIER_TVA_TAUX:21}
    # Compte pour les virements : imprimé sur les factures avec un QR code à scanner dans l'appli bancaire
    iban: ${APP_ATELIER_IBAN:}
    bic: ${APP_ATELIER_BIC:}
    adresse: ${APP_ATELIER_ADRESSE:Rue Wayez 24, 1070 Anderlecht}
    telephone: ${APP_ATELIER_TELEPHONE:+32 485 64 44 61}
    email: ${APP_ATELIER_EMAIL:pcpro@gmail.com}
    site-web: ${APP_ATELIER_SITE_WEB:pcpro-services.be}
    horaires: "${APP_ATELIER_HORAIRES:Mar-jeu 10h-13h et 14h-18h30 · Ven 10h-13h30 et 15h-18h · Sam 10h-16h}"
    # Chemin d'une image (PNG ou JPG) qui remplace le logo dessiné en haut des documents
    logo: ${APP_ATELIER_LOGO:}
    # Durée pendant laquelle le prix d'un devis est garanti
    devis-validite-jours: ${APP_DEVIS_VALIDITE_JOURS:30}
    # Texte libre imprimé en bas des factures (ex : "Payable au comptant")
    mention-facture: ${APP_MENTION_FACTURE:}
    # Adresse de l'appli vue par les clients (liens de suivi, QR code), ex : https://atelier.pcpro-services.be
    url-publique: ${APP_URL_PUBLIQUE:}
    # Garantie par défaut d'une réparation (modifiable à la clôture, 0 = aucune)
    garantie-mois: ${APP_GARANTIE_MOIS:3}
    # Au-delà, un appareil prêt et pas récupéré apparaît dans les "non récupérés"
    delai-recuperation: ${APP_DELAI_RECUPERATION:7d}
    # Conditions imprimées sur le bon de dépôt, séparées par des retours à la ligne (vide : conditions par défaut)
    conditions-depot: ${APP_CONDITIONS_DEPOT:}
  mail:
    # Adresse d'envoi, sur un domaine validé chez le fournisseur : "Pc Pro <atelier@pcpro-services.be>"
    expediteur: ${APP_MAIL_EXPEDITEUR:}
  security:
    # Obligatoire, au moins 32 caractères. Générer avec : openssl rand -base64 48
    jwt-secret: ${APP_JWT_SECRET:}
    # Token d'accès court ; le front le renouvelle tout seul grâce au cookie de session (refresh)
    jwt-ttl: 15m
    # Durée du "rester connecté" sur un appareil, prolongée à chaque utilisation
    refresh-ttl: 30d
    # Cookie de session envoyé uniquement en HTTPS (désactivé en dev, où tout est en http)
    cookie-secure: ${APP_COOKIE_SECURE:true}
    login-max-echecs: 5
    login-max-echecs-par-ip: 20
    login-blocage: 15m
    # Origines du front autorisées, séparées par des virgules (ex : http://localhost:4200)
    cors-allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:}
  storage:
    photos-directory: ${APP_STORAGE_PHOTOS_DIRECTORY:./uploads/photos}
    max-file-size-bytes: 10485760  # 10MB
  bootstrap:
    admin-login: ${APP_BOOTSTRAP_ADMIN_LOGIN:}
    admin-password: ${APP_BOOTSTRAP_ADMIN_PASSWORD:}
    admin-prenom: ${APP_BOOTSTRAP_ADMIN_PRENOM:Admin}
