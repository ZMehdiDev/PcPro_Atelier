<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Pc Pro Atelier</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f4ef">
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="manifest" href="manifest.webmanifest">
  <script>
    // Thème appliqué avant l'affichage (sinon un flash blanc en mode sombre)
    (function () {
      var t = null;
      try { t = localStorage.getItem('atelier.theme'); } catch (e) {}
      if (t !== 'dark' && t !== 'light') {
        t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.dataset.theme = t;
      if (t === 'dark') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#161513');
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
